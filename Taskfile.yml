# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  REPO_URL: $REPO_URL

tasks:
  setup-dev:
    desc: Setup the development environment
    cmds:
      - task build-frontend
    silent: true

  build-frontend:
    desc: Build the frontend application
    dir: ./apps/frontend
    cmds:
      - pnpm install
      - pnpm build
    silent: true

  test-frontend:
    desc: Test the frontend application
    dir: ./apps/frontend
    cmds:
      - pnpm test
    silent: true

  extract-messages-frontend:
    desc: Extract messages from the frontend application
    dir: ./apps/frontend
    cmds:
      - pnpm run extract-messages
    silent: true

  extract-messages-watch-frontend:
    desc: Extract messages from the frontend application
    dir: ./apps/frontend
    cmds:
      - pnpm run extract-messages -- --watch
    interactive: true
    silent: true

  build-cli:
    desc: Build the CLI application
    cmds:
      - go build -ldflags "-X consts.RepoURL={{.REPO_URL}}" -o bin/dsy ./apps/cli
    silent: true

  generate-slqc:
    desc: Generate the SQLc code
    dir: ./apps/backend
    cmds:
      - sqlc generate
    silent: true

  run-dev-detached:
    desc: Run the development environment detached using podman compose
    cmds:
      - podman compose -f docker-compose.dev.yml up -d --build
    silent: true
