services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: dotsync-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://dotsync_user:dotsync_password@db:5432/dotsync_db
    ports:
      - "8067:8067"
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    container_name: dotsync-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dotsync_user
      POSTGRES_PASSWORD: dotsync_password
      POSTGRES_DB: dotsync_db
    ports:
      - "5432:5432"